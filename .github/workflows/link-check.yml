name: Link check

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@v2
        with:
          # LinkedIn answers every automated request with status 999, so a working profile link
          # would fail the check.
          args: --no-progress --exclude linkedin.com README.md docs report/*.qmd
          fail: true
